
name: CashMate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      
      
      - name: Diagnose npm lockfile
        run: |
          pwd
          node --version
          npm --version
          node -e "const p=require('./package.json'); console.log('package name:', p.name)"
          node -e "const l=require('./package-lock.json'); console.log('lockfileVersion:', l.lockfileVersion); console.log('root package:', l.packages?.['']?.name)"
          npm config get package-lock


      - name: Install frontend dependencies
        run: npm ci --prefix .

      - name: Build frontend
        run: npm run build


      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend Docker image
        run: docker build -t cashmate-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t cashmate-frontend .

