
name: CashMate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      
      - name: Verify frontend files
        run: |
          pwd
          ls -la
          test -f package.json
          test -f package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix .

      - name: Build frontend
        run: npm run build


      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend Docker image
        run: docker build -t cashmate-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t cashmate-frontend .

